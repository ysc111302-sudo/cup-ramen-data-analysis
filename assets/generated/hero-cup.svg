<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="Abstract cup noodle illustration">
  <defs>
    <linearGradient id="cupG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A531"/>
      <stop offset="0.55" stop-color="#E23B2E"/>
      <stop offset="1" stop-color="#B2191C"/>
    </linearGradient>
    <linearGradient id="lidG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE8B0"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="450" cy="380" r="360" fill="url(#glow)"/>
  <!-- steam -->
  <g stroke="#FDF6EC" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M330 210 C300 170 360 150 330 110">
      <animate attributeName="d"
        values="M330 210 C300 170 360 150 330 110;M330 210 C360 170 300 150 330 110;M330 210 C300 170 360 150 330 110"
        dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M450 200 C420 160 480 140 450 100">
      <animate attributeName="d"
        values="M450 200 C420 160 480 140 450 100;M450 200 C480 160 420 140 450 100;M450 200 C420 160 480 140 450 100"
        dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M570 210 C540 170 600 150 570 110">
      <animate attributeName="d"
        values="M570 210 C540 170 600 150 570 110;M570 210 C600 170 540 150 570 110;M570 210 C540 170 600 150 570 110"
        dur="5.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- cup body -->
  <path d="M250 300 L650 300 L600 780 Q596 810 566 810 L334 810 Q304 810 300 780 Z" fill="url(#cupG)"/>
  <!-- rim band -->
  <rect x="250" y="300" width="400" height="58" rx="14" fill="#FDF6EC" opacity="0.92"/>
  <!-- label stripe -->
  <rect x="300" y="470" width="300" height="120" rx="26" fill="#FDF6EC" opacity="0.16"/>
  <!-- noodles -->
  <g stroke="#F7A531" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M330 470 q60 -60 120 0 q60 60 120 0"/>
    <path d="M330 520 q60 -60 120 0 q60 60 120 0"/>
    <path d="M340 575 q55 -50 110 0 q55 50 110 0"/>
  </g>
  <!-- lid -->
  <ellipse cx="450" cy="300" rx="210" ry="42" fill="url(#lidG)"/>
  <ellipse cx="450" cy="300" rx="210" ry="42" fill="none" stroke="#B2191C" stroke-opacity="0.25" stroke-width="4"/>
  <!-- chopsticks -->
  <g transform="rotate(18 720 260)">
    <rect x="700" y="60" width="20" height="360" rx="10" fill="#8B5E3C"/>
    <rect x="740" y="60" width="20" height="360" rx="10" fill="#A9744F"/>
  </g>
</svg>
